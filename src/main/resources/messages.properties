# Shared error messages (ProblemDetail). Each bounded context adds its own keys below.
error.validation.message=Validation failed
error.business-rule.message=Business rule violation
error.unexpected.message=Unexpected error
error.not-found.message=Resource not found
error.conflict.message=Resource conflict
error.generic.message=Application error
validation.request.failed=Request validation failed
validation.request.argument=request-argument
validation.field.prefix=Field
error.unexpected.context=global-exception-handler

# Subscriptions & Payments
errors.found=Errors Found:
plan.error.planKey.notBlank=planKey must not be null or blank.
plan.error.planKey.size=planKey must not exceed 64 characters.
plan.error.planKey.pattern=planKey must be in kebab case, for example standard-lab.
plan.error.name.notBlank=name must not be null or blank.
plan.error.limits.invalid=userLimit and iotDeviceLimit must not be negative (0 means unlimited).
plan.error.id.invalid=Plan id must be greater than 0.
money.error.amount.invalid=Price must not be null or negative.
money.error.currency.pattern=currency must be a three-letter ISO 4217 code, for example PEN.
subscription.error.id.invalid=Subscription id must be greater than 0.
subscription.error.organizationId.invalid=organizationId must be greater than 0.
subscription.error.billingCycle.invalid=billingCycle must be MONTHLY or ANNUAL.
subscription.error.billingEmail.notBlank=billingEmail must not be null or blank.
subscription.error.billingEmail.size=billingEmail must not exceed 254 characters.
subscription.error.billingEmail.pattern=billingEmail must be a valid email address.
subscription.error.cardBrand.notBlank=cardBrand must not be null or blank.
subscription.error.cardBrand.size=cardBrand must not exceed 20 characters.
payment.error.notNull=payment must not be null.
payment.error.invoiceNumber.notBlank=invoiceNumber must not be null or blank.
payment.error.transactionId.notBlank=The gateway transaction id must not be null or blank.
payment.error.cardToken.notBlank=cardToken must not be null or blank.
subscription.error.cardLast4.pattern=cardLast4 must have exactly four digits.
subscription.error.cardExpiry.pattern=cardExpiry must use the MM/yyyy format.
error.plan-not-found.message=The plan does not exist.
error.plan-conflict.message=A plan with the same planKey already exists.
error.subscription-not-found.message=The subscription does not exist.
error.subscription-conflict.message=The organization already has a pending or active subscription.
