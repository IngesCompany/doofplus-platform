# Spring Application Name
spring.application.name=DoofPlus Platform

# Active profile when SPRING_PROFILES_ACTIVE is not set (dev or prod)
spring.profiles.default=dev

# Spring DataSource Configuration (URL, user and password are in application-dev and application-prod)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.ingescompany.doofplus.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Internationalization of error messages (en, es)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# OpenAPI documentation (values taken from pom.xml)
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Niubiz payment gateway (sandbox by default; the merchant and credentials come from environment variables)
niubiz.base-url=${NIUBIZ_BASE_URL:https://apisandbox.vnforappstest.com}
niubiz.merchant-id=${NIUBIZ_MERCHANT_ID:}
niubiz.username=${NIUBIZ_USERNAME:}
niubiz.password=${NIUBIZ_PASSWORD:}

# Virtual threads (Project Loom)
spring.threads.virtual.enabled=true
